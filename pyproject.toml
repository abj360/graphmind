[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "graphmind"
version = "0.1.0"
description = "LLM-driven knowledge graph extraction pipeline"
requires-python = ">=3.12"

dependencies = [
    "pydantic>=2.6",
    "neo4j>=5.17",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "mypy>=1.9",
]
