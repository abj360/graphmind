[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "graphmind"
version = "0.2.0"
description = "LLM-driven knowledge graph extraction pipeline"
requires-python = ">=3.12"

dependencies = [
    "pydantic>=2.6",
    "neo4j>=5.17",
    "langchain-core>=0.2",
    "langchain-openai>=0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "mypy>=1.9",
]

[tool.setuptools.packages.find]
include = ["extract*", "resolution*", "load*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
